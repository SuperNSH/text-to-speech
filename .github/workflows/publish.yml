name: Publish crates

# Publishes nsh-text-to-speech to crates.io. Runs on a version tag, or by hand for an existing tag: a
# rerun uploads only what crates.io does not have. Needs the CARGO_REGISTRY_TOKEN secret.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, such as v0.1.0"
        required: true

# One publish at a time; never cancelled halfway.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Check the versions match the tag
        run: |
          version=${TAG#v}
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "$TAG is not a version tag"; exit 1; }
          for f in packages/*/package.json; do
            [ -f "$f" ] || continue
            v=$(jq -er .version "$f")
            [ "$v" = "$version" ] || { echo "$f is $v, not $version"; exit 1; }
          done
          grep -q "^## $version " CHANGELOG.md || { echo "CHANGELOG.md has no $version entry"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # crates.io versions are permanent, so the tagged commit must have passed CI. The tag is often
      # pushed right after the commit: wait for the run.
      - name: Wait for CI on this commit
        timeout-minutes: 120
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          idle=0
          while :; do
            runs=$(gh run list --workflow ci.yml --commit "$sha" --json status,conclusion)
            if jq -e 'any(.[]; .conclusion == "success")' <<< "$runs" > /dev/null; then
              echo "CI passed on $sha"
              exit 0
            fi
            if jq -e 'any(.[]; .status != "completed")' <<< "$runs" > /dev/null; then
              idle=0
            else
              idle=$((idle + 1))
              # No run going: allow two minutes for one to start.
              if [ "$idle" -ge 4 ]; then
                echo "CI has not passed on $sha. Run it with: gh workflow run ci.yml --ref $TAG"
                exit 1
              fi
            fi
            sleep 30
          done

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install Linux packages
        run: sudo apt-get update && sudo apt-get install -y dbus dbus-user-session libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev clang llvm

      - name: Package and build from the packages
        run: scripts/publish-crates.sh verify

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] || { echo "The CARGO_REGISTRY_TOKEN secret is not available to this repository"; exit 1; }
          scripts/publish-crates.sh publish "$VERSION"
