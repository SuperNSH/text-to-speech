name: Publish crates (Manual)

# Publishes nsh-text-to-speech to crates.io from an existing tag. changelog-release.yml calls it; by hand it recovers
# a version that failed halfway: a rerun uploads only what crates.io does not have.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, such as v0.1.0"
        required: true

# One publish at a time; never cancelled halfway.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Check the versions match the tag
        run: |
          version=${TAG#v}
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "$TAG is not a version tag"; exit 1; }
          for f in packages/*/package.json; do
            [ -f "$f" ] || continue
            v=$(jq -er .version "$f")
            [ "$v" = "$version" ] || { echo "$f is $v, not $version"; exit 1; }
          done
          grep -qE "^## \[?${version//./\\.}(\]| )" CHANGELOG.md || { echo "CHANGELOG.md has no $version entry"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install Linux packages
        run: sudo apt-get update && sudo apt-get install -y dbus dbus-user-session libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev clang llvm

      - name: Package and build from the packages
        run: scripts/publish-crates.sh verify

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] || { echo "The CARGO_REGISTRY_TOKEN secret is not available to this repository"; exit 1; }
          scripts/publish-crates.sh publish "$VERSION"
