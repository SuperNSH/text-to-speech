name: CI

# Every compile and test runs here, on GitHub's runners, never on a developer's machine.
# kache caches compiler outputs in GitHub's Actions cache; only master saves to it.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # GTK 4, WebKitGTK 6.0 and GStreamer's core and base plug-ins are what NSH's Linux crates build against
  # (docs/dev/linux.md in NSH); the release runner of `nsh package --target linux` links GStreamer for sounds.
  LINUX_PACKAGES: dbus dbus-user-session libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev clang llvm

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.1.1
          cache-dir: ${{ runner.temp }}/kache
          manifest-key: rust-${{ matrix.os }}
          cache-key-prefix: kache-rust-${{ matrix.os }}
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          pr-comment: false
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - run: cargo clippy -p nsh-text-to-speech --all-targets -- -D warnings
      - run: cargo test -p nsh-text-to-speech --all-targets

  cross-check:
    name: check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-ios }
          - { os: macos-latest, target: aarch64-apple-ios-sim }
          - { os: ubuntu-latest, target: aarch64-linux-android }
          - { os: ubuntu-latest, target: wasm32-unknown-unknown }
          # No sixth platform: wasip1 is where the unsupported-target path and its
          # not-available test compile, so that promise is checked too.
          - { os: ubuntu-latest, target: wasm32-wasip1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
          targets: ${{ matrix.target }}
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.1.1
          cache-dir: ${{ runner.temp }}/kache
          manifest-key: check-${{ matrix.target }}
          cache-key-prefix: kache-check-${{ matrix.target }}
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          pr-comment: false
      - name: Point cc at the NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - run: cargo clippy -p nsh-text-to-speech --target ${{ matrix.target }} --all-targets -- -D warnings

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install NSH
        env:
          NSH_VERSION: v0.5.1
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: The package, check and build without warnings, then test
        working-directory: packages/nsh-text-to-speech
        run: |
          nsh check
          nsh build 2>&1 | tee build.log
          ! grep -i warn build.log
          nsh test
      - name: The demo, check and build without warnings, then test
        working-directory: examples/demo
        run: |
          nsh check
          nsh build 2>&1 | tee build.log
          ! grep -i warn build.log
          nsh test

  demo:
    name: demo (${{ matrix.name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [format, rust, typescript]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop builds come out for the runner's own processor, so each architecture gets its own runner.
          # NSH's v0.5.1 release ships a prebuilt CLI for every one of them, so all install it the same way.
          - { os: macos-latest, target: macos, name: macos-arm64 }
          - { os: macos-15-intel, target: macos, name: macos-x86_64 }
          - { os: ubuntu-latest, target: linux, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux, name: linux-arm64 }
          - { os: windows-latest, target: windows, name: windows-x86_64 }
          - { os: windows-11-arm, target: windows, name: windows-arm64 }
          - { os: macos-latest, target: ios-simulator, name: ios-simulator }
          - { os: ubuntu-latest, target: android, name: android }
          - { os: ubuntu-latest, target: web, name: web }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target == 'android' && 'aarch64-linux-android' || matrix.target == 'web' && 'wasm32-unknown-unknown' || matrix.target == 'ios-simulator' && 'aarch64-apple-ios-sim' || '' }}
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.1.1
          cache-dir: ${{ runner.temp }}/kache
          manifest-key: demo-${{ matrix.name }}
          cache-key-prefix: kache-demo-${{ matrix.name }}
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          pr-comment: false
      - name: Install the wasm-bindgen CLI that NSH's web runtime needs
        if: matrix.target == 'web'
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - name: Install NSH
        if: runner.os != 'Windows'
        env:
          NSH_VERSION: v0.5.1
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install NSH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NSH_VERSION: v0.5.1
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Package
        shell: bash
        working-directory: examples/demo
        run: |
          abi=""
          [ "${{ matrix.target }}" = android ] && abi="--abi arm64-v8a"
          nsh package App.tsx --target ${{ matrix.target }} $abi --app-version 0.1.0 --build ${{ github.run_number }} --out "$RUNNER_TEMP/out"
      - name: Name the build
        shell: bash
        run: |
          mkdir -p dist
          cd "$RUNNER_TEMP/out"
          name="text-to-speech-demo-${{ matrix.name }}"
          case "${{ matrix.target }}" in
            android) cp ./*.apk "$GITHUB_WORKSPACE/dist/$name.apk" ;;
            linux) cp ./*.tar.gz "$GITHUB_WORKSPACE/dist/$name.tar.gz" ;;
            macos|ios-simulator) ditto -c -k --keepParent ./*.app "$GITHUB_WORKSPACE/dist/$name.zip" ;;
            windows) 7z a "$GITHUB_WORKSPACE/dist/$name.zip" ./* > /dev/null ;;
            web) tar -czf "$GITHUB_WORKSPACE/dist/$name.tar.gz" * ;;
          esac
          ls -la "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish the latest build
    needs: [format, rust, cross-check, typescript, demo]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          test "$(ls dist | wc -l)" -eq 9 || { echo "expected nine demo builds in dist:"; ls -la dist; exit 1; }
          gh release delete latest --repo "$REPO" --cleanup-tag --yes || true
          gh release create latest dist/* --repo "$REPO" --target "$GITHUB_SHA" --latest \
            --title "Latest build" \
            --notes "Demo builds from master at $GITHUB_SHA, replaced on every push to master. Unsigned: macOS and Windows will warn before opening them, and the iOS build runs only in the simulator."

  pages:
    name: deploy the web demo to Pages
    needs: [format, rust, cross-check, typescript, demo]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level permissions replace the workflow's, and deploy-pages authenticates with OIDC.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # The pages group, not ci-<ref>, so a deployment from an older run is cancelled by a newer one.
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-web
          path: dist
      - name: Unpack the web build
        run: |
          # NSH packages the web build inside a directory named after the app; the site root is its contents.
          mkdir -p "$RUNNER_TEMP/site"
          tar -xzf dist/text-to-speech-demo-web.tar.gz -C "$RUNNER_TEMP/site" --strip-components=1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
